info:
  name: 00 Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_base_url}}/health"
  auth: none
  headers:
    - name: Accept
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("returns 200", function() {
    expect(res.getStatus()).to.equal(200);
  });

  test("returns service ok payload", function() {
    const body = res.getBody();
    expect(body.status).to.equal("ok");
    expect(body.service).to.equal("lumen-api");
  });

docs: Basic connectivity check for the local or shared-cloud-backed Lumen API.
