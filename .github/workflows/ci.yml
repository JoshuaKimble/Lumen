name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run mobile checks
        run: ./scripts/check_mobile.sh

  api:
    name: API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Run API checks
        run: ./scripts/check_api.sh

  contracts:
    name: Contracts Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/api_contracts/package-lock.json

      - name: Run contract checks
        run: ./scripts/check_contracts.sh

  supabase:
    name: Supabase Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Supabase checks
        run: ./scripts/check_supabase.sh

  supabase-cloud:
    name: Supabase Cloud Deploy
    runs-on: ubuntu-latest
    needs:
      - mobile
      - api
      - contracts
      - supabase
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    env:
      LUMEN_USE_SUPABASE: ${{ vars.LUMEN_USE_SUPABASE }}
      LUMEN_SUPABASE_URL: ${{ vars.LUMEN_SUPABASE_URL }}
      LUMEN_SUPABASE_DB_URL: ${{ secrets.LUMEN_SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase shared cloud check
        run: bash ./scripts/check_supabase_cloud.sh

      - name: Push Supabase migrations to shared cloud
        run: bash ./scripts/supabase_push_cloud.sh
