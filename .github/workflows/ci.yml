name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            supabase:
              - 'supabase/**'
            web:
              - 'apps/mobile/**'

  mobile:
    name: Mobile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run mobile checks
        run: ./scripts/check_mobile.sh

  api:
    name: API Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Run API checks
        run: ./scripts/check_api.sh

  contracts:
    name: Contracts Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/api_contracts/package-lock.json

      - name: Run contract checks
        run: ./scripts/check_contracts.sh

  supabase:
    name: Supabase Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Supabase checks
        run: ./scripts/check_supabase.sh

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs:
      - changes
      - mobile
    if: ${{ needs.changes.outputs.web == 'true' }}
    environment: production
    env:
      LUMEN_API_BASE_URL: ${{ vars.LUMEN_API_BASE_URL }}
      LUMEN_SUPABASE_URL: ${{ vars.LUMEN_SUPABASE_URL }}
      LUMEN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LUMEN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required web build variables
        run: |
          required_vars=(
            LUMEN_API_BASE_URL
            LUMEN_SUPABASE_URL
            LUMEN_SUPABASE_PUBLISHABLE_KEY
          )
          for key in "${required_vars[@]}"; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required web build variable: $key" >&2
              exit 1
            fi
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Flutter web
        working-directory: apps/mobile
        run: |
          flutter build web --pwa-strategy=none \
            --dart-define=LUMEN_USE_API_AI=true \
            --dart-define=LUMEN_API_BASE_URL="${LUMEN_API_BASE_URL}" \
            --dart-define=LUMEN_USE_SUPABASE=true \
            --dart-define=LUMEN_SUPABASE_URL="${LUMEN_SUPABASE_URL}" \
            --dart-define=LUMEN_SUPABASE_PUBLISHABLE_KEY="${LUMEN_SUPABASE_PUBLISHABLE_KEY}"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: apps/mobile/build/web
          if-no-files-found: error

  supabase-cloud:
    name: Supabase Cloud Deploy
    runs-on: ubuntu-latest
    needs:
      - changes
      - mobile
      - api
      - contracts
      - supabase
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.supabase == 'true' }}
    environment: production
    env:
      LUMEN_USE_SUPABASE: ${{ vars.LUMEN_USE_SUPABASE }}
      LUMEN_SUPABASE_URL: ${{ vars.LUMEN_SUPABASE_URL }}
      LUMEN_SUPABASE_DB_URL: ${{ secrets.LUMEN_SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase shared cloud check
        run: bash ./scripts/check_supabase_cloud.sh

      - name: Push Supabase migrations to shared cloud
        run: bash ./scripts/supabase_push_cloud.sh

  web-deploy:
    name: Web Deploy
    runs-on: ubuntu-latest
    needs:
      - web-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: web-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME}" ]]; then
            echo "Missing required Cloudflare Pages project variable: CLOUDFLARE_PAGES_PROJECT_NAME" >&2
            exit 1
          fi

          npx --yes wrangler@4 pages deploy web-dist \
            --project-name "${CLOUDFLARE_PAGES_PROJECT_NAME}" \
            --branch master
